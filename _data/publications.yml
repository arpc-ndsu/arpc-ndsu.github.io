# ==============================================================================
# The centre's publications.
# ------------------------------------------------------------------------------
# One entry per publication. Seeded from the publications sitemap on
# arpc-ndsu.com, so the list is complete as of 2026-09-19 -- but `type` and
# `authors` were not in the sitemap and need filling in.
#
#   title        as it appears on the publication
#   authors      surname-first, as a citation would print them
#   year         the year of issue
#   type         "ARPC Report" | "ARPC White Paper" | "ARPC Working Paper"
#                (the three types the AgEconSearch collection defines)
#   site         the page on arpc-ndsu.com
#   interactive  the folder under /publications/ holding the interactive
#                edition, once one has been built. Omit until then -- an entry
#                without it simply shows no "Read online" link.
#   pdf          a PDF served from this site, if one is
#   doi          once AgEconSearch has issued one
#
# TYPE IS A PLACEHOLDER ON EVERY ENTRY. They are all marked "ARPC Report"
# because that is the series the reports themselves cite; correct any that are
# white or working papers.
# ==============================================================================

