# ==============================================================================
# ARPC at NDSU -- arpc-ndsu.github.io
# ------------------------------------------------------------------------------
# A vendored academicpages site, built by GitHub Pages' own Jekyll (the
# `github-pages` gem pins every allowed plugin to the versions GitHub runs), so
# there is no build step to maintain and nothing to install on a server.
#
# THE REPOSITORY NAME IS LOad-BEARING. GitHub serves `<name>.github.io` from the
# domain root, which is why `baseurl` is empty and every link resolves at
# https://arpc-ndsu.github.io/... . In any other repository the same files would
# serve one level down and every link in the site would be wrong.
# ==============================================================================

locale                   : "en-US"
site_theme               : "default"
title                    : "Agricultural Risk Policy Center"
title_separator          : "-"
name                     : &name "Agricultural Risk Policy Center at NDSU"
description              : &description "Objective, evidence-based research on agricultural risk management and the U.S. farm safety net"
url                      : https://arpc-ndsu.github.io
baseurl                  : ""
repository               : "arpc-ndsu/arpc-ndsu.github.io"

# The sidebar identity. An organisation rather than a person, so the fields that
# exist for a CV and a headshot carry the centre's own details instead.
author:
  avatar           : "https://github.com/arpc-ndsu.png"
  name             : "Agricultural Risk Policy Center"
  bio              : "North Dakota State University"
  location         : "Fargo, ND"
  employer         : "North Dakota State University"
  uri              : "https://www.arpc-ndsu.com/"
  email            : "ndsu.arpc@ndsu.edu"
  github           : "arpc-ndsu"

# Reading and page furniture
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               : false
atom_feed:
  hide                   : false

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Etc/UTC

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# A REPORT IS NOT A JEKYLL PAGE. The interactive editions are complete, self
# contained HTML documents with their own <html> element, so they are copied
# through untouched rather than wrapped in a layout. Jekyll skips anything it
# does not recognise, but `include` makes it explicit and survives a future
# `exclude` rule that would otherwise catch them.
include:
  - publications

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - README.md
  - publications/README.md
